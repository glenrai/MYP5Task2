/* ---------- sticky header ---------- */

.cloze select.gap { min-width: 9rem; padding: 4px 8px; font-family: var(--display); font-size: .9rem; }
.gn { font-family: var(--mono); font-size: .66rem; vertical-align: super; color: var(--ink2); margin-right: 2px; }
.gaplist { list-style: none; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 8px; }
.gaplist li { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 8px; font-size: .93rem; }
.gaplist li b.g { font-family: var(--mono); font-size: .74rem; letter-spacing: .05em; }
.gaplist li.ok b.g { color: var(--ok); }
.gaplist li.bad b.g { color: var(--bad); }

.submit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.score { font-size: 1.35rem; font-weight: 800; }
.score.strong { color: var(--ok); }

/* writing */
.brief { max-width: 72ch; }
.orig { border: 1px dashed var(--ink2); border-radius: 10px; padding: 10px 14px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; }
.orig p { font-family: var(--serif); font-size: 1.08rem; }
.wf { display: flex; flex-direction: column; gap: 6px; }
.wf label { font-weight: 700; }
.wf textarea, .rev textarea, .refl textarea { border: 1px solid var(--ink2); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; line-height: 1.6; font-family: var(--serif); font-size: 1.05rem; resize: vertical; }
.wc { font-family: var(--mono); font-size: .74rem; color: var(--ink2); }
.wc.met { color: var(--ok); }
.wc.warn { color: var(--warn); }

.results { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 230px; }
.scan, .model, .selfcheck, .rev, .alt, .refl, .cat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.results h3 { font-size: 1.1rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.results h3 span { font-family: var(--mono); font-size: .76rem; color: var(--ink2); font-weight: 400; }
.scan ul, .cat ul { list-style: none; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 8px; }
.scan li, .cat li { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr); gap: 8px; align-items: start; }
.scan li i, .cat li i { font-style: normal; font-family: var(--mono); width: 1.5rem; height: 1.5rem; display: grid; place-items: center; border-radius: 50%; font-size: .8rem; }
.scan li.ok i, .cat li.ok i { background: var(--ok-soft); color: var(--ok); }
.scan li.no i, .cat li.no i { background: var(--warn-soft); color: var(--warn); }
.scan li div, .cat li div { display: flex; flex-direction: column; }
.scan li span, .cat li span { font-size: .88rem; color: var(--ink2); }
.model { background: var(--bg); }
.model-t { max-width: 75ch; font-family: var(--serif); font-size: 1.1rem; line-height: 2; }
.model-t p + p { margin-top: .6em; }
.model-t.tight { line-height: 1.9; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: .8rem; }
.hl { padding: 1px 3px; border-radius: 3px; color: var(--ink); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-a { background: var(--hl-a); }
.hl-l { background: var(--hl-l); }
.hl-g { background: var(--hl-g); }
.hl-s { background: var(--hl-s); }
.hl-c { background: var(--hl-c); }
.hl-v { background: var(--hl-v); }
.hl-p { background: var(--hl-p); }
sup.nt { font-family: var(--mono); font-size: .62rem; font-weight: 700; margin-left: 2px; color: var(--ink); }
ol.notes { list-style: none; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
ol.notes li { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: 8px; align-items: start; }
ol.notes .nn { font-family: var(--mono); font-size: .74rem; font-weight: 700; text-align: center; border-radius: 6px; padding: 1px 0; color: var(--ink); }
.alt { background: var(--blue-soft); border-color: transparent; }
.selfcheck ul { list-style: none; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 6px; }
.selfcheck label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; }
.selfcheck input { margin-top: .35em; width: 1.1rem; height: 1.1rem; accent-color: var(--blue); }
.rev label, .refl label { font-weight: 700; }
.ex { display: flex; flex-direction: column; gap: 10px; }
.ex .ex-f { border-left: 3px solid var(--accent); padding-left: 12px; display: flex; flex-direction: column; gap: 2px; }
.ex .ex-f b { font-size: .9rem; }
.ex .ex-f span { font-family: var(--serif); font-size: 1.02rem; }
.plot-svg { width: 100%; max-width: 640px; height: auto; color: var(--ink); }
.plot-svg .curve { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.plot-svg circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.plot-svg text { fill: currentColor; font-family: var(--display); font-size: 13px; font-weight: 700; }

.pre { border: 2px solid var(--ink); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.pre h3 { font-size: 1.05rem; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.pre h3 span { font-family: var(--mono); font-size: .76rem; color: var(--ink2); font-weight: 400; }
.pre ul { list-style: none; margin: 0; padding: 0 !important; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
@media (max-width: 720px) { .pre ul { grid-template-columns: minmax(0, 1fr); } }
.pre label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; font-size: .95rem; }
.pre input { margin-top: .3em; width: 1.1rem; height: 1.1rem; accent-color: var(--blue); }
details.plan-d { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--bg); }
details.plan-d summary { cursor: pointer; font-weight: 700; }
details.plan-d .ex { margin-top: 10px; }
details.more { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
details.more > summary { cursor: pointer; font-weight: 700; }
details.more[open] > summary { margin-bottom: 10px; }
.cat-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.cat-h b { font-size: 1.02rem; }
.cat-s { font-family: var(--mono); font-size: .72rem; padding: 2px 8px; border-radius: 999px; }
.cat-s.ok { background: var(--ok-soft); color: var(--ok); }
.cat-s.mid { background: var(--warn-soft); color: var(--warn); }
.cat-s.low { background: var(--bad-soft); color: var(--bad); }
.next { border: 2px solid var(--accent); border-radius: 12px; padding: 14px 16px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 6px; }
.next b { font-size: 1.05rem; }
.done-banner { background: var(--ok-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
.step-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 4px; }
.report { width: 100%; min-height: 14rem; font-family: var(--mono); font-size: .8rem; line-height: 1.5; border: 1px solid var(--ink2); border-radius: 10px; padding: 10px 12px; background: var(--bg); resize: vertical; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sum div { background: var(--surface2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.sum b { font-size: 1.6rem; font-weight: 800; }

@media (max-width: 560px) {
  .wrap { padding-top: 14px; }
  .card { padding: 16px; }
  .clock-t { font-size: 1.65rem; }
  .brand-name { display: none; }
  .bars { grid-template-columns: 3.6rem 1fr; }
  .pace { flex-wrap: nowrap; }
  .pace > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  .track i, .seg i { transition: none; }
}
@media print {
  .top, .step-nav, .btn { display: none !important; }
}

<script>
/* Workshop content. Sample and model answers are written for the two default images and the default
   global context (see the EDIT ME block at the top of the page). If you change the images or the
   global context, the examples, samples and models below need rewriting to match. */

const TOTAL_MIN = 45;

/* Highlight kinds used in samples and models: [[k:text|optional note]] */
const KINDS = {
  a: 'Setting and atmosphere',
  l: 'Language choice',
  g: 'Global context',
  s: 'Symbol or motif',
  c: 'Characterisation',
  v: 'Narrative voice',
  p: 'Plot moment'
};

const PRE_CHECK = [
  'I have chosen one image and used its details purposefully.',
  'My writing connects clearly to the global context.',
  'I have established a convincing setting and atmosphere.',
  'My protagonist has a clear desire, problem or conflict.',
  'My piece has a deliberate narrative perspective.',
  'I have used characterisation through action, dialogue, thought and detail.',
  'My plot has movement or a meaningful moment of change.',
  'I have used language choices deliberately.',
  'I have checked spelling, punctuation, paragraphing and sentence variety.'
];

const SECTIONS = [
  /* =========================================================== 1 QUICK START */
  {
    id: 's1', title: 'Quick start', min: 5, due: 5,
    blocks: [
      { type: 'teach', title: 'Your Task 2 challenge', html: `
        <p>In eAssessment Task 2 you <b>choose one of two images</b> and create a piece of creative writing shaped by the stated <b>global context</b>. Four ideas guide everything in this workshop:</p>
        <ol class="four">
          <li><b>Choose one image</b> and use its details on purpose.</li>
          <li><b>Let the global context do real work.</b> It should drive the conflict, the setting, a character's choices or a symbol.</li>
          <li><b>Make deliberate choices.</b> A piece that only describes the image earns little. Every detail needs a job: atmosphere, character or plot.</li>
          <li><b>Build a moment of change.</b> Your protagonist decides, learns or loses something.</li>
        </ol>
        <p class="formula"><span>Image detail</span> → <span>Your choice</span> → <span>Effect on the reader</span> → <span>Link to the global context</span></p>` },
      { type: 'activity', kind: 'quiz', id: 'q1', title: 'Quick check: match the technique to its purpose',
        lead: 'Choose the letter of the purpose that matches each technique. Each purpose is used once.',
        list: [
          ['A', 'Builds the place and time so that it shapes mood and puts pressure on a character.'],
          ['B', 'Lets an object or image carry a bigger idea without stating it.'],
          ['C', 'Shows relationships and conflict through what characters say and leave unsaid.'],
          ['D', 'Controls pace: short sentences hit hard, long ones flow or overwhelm.'],
          ['E', 'Gives the reader the situation, time and place they need in as few words as possible.'],
          ['F', 'Plants a hint early so later events feel earned and tension builds.'],
          ['G', 'Decides whose eyes and mind the reader sees through, and how much they know.'],
          ['H', 'Lets the reader know a character through actions, words, thoughts and belongings.'],
          ['I', 'Puts the reader inside the moment through sight, sound, smell, touch and taste.']
        ],
        letters: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'],
        items: [
          { id: 'i1', lab: 'Exposition', type: 'select', prompt: 'Exposition', answer: 'E', why: 'Exposition is the setup. Strong exposition is brief: one telling detail carries more than a paragraph of background.' },
          { id: 'i2', lab: 'Characterisation', type: 'select', prompt: 'Characterisation', answer: 'H', why: 'Readers work out who a character is from evidence: what they do, say, think, own and how they react.' },
          { id: 'i3', lab: 'Setting', type: 'select', prompt: 'Setting', answer: 'A', why: 'Setting is more than a backdrop. A cramped, flooded or silent place pressures the character and sets the mood.' },
          { id: 'i4', lab: 'Dialogue', type: 'select', prompt: 'Dialogue', answer: 'C', why: 'The best dialogue has subtext. Characters talk about one thing while the real conflict sits underneath.' },
          { id: 'i5', lab: 'Sensory imagery', type: 'select', prompt: 'Sensory imagery', answer: 'I', why: 'Sight is only one sense. Sound, smell, touch and taste make a scene feel physical.' },
          { id: 'i6', lab: 'Symbolism', type: 'select', prompt: 'Symbolism', answer: 'B', why: 'A repeated object (a curtain, a coat, a bottle) can carry an idea. The writer never has to explain it.' },
          { id: 'i7', lab: 'Foreshadowing', type: 'select', prompt: 'Foreshadowing', answer: 'F', why: 'A small early detail, such as a crack in the wall, makes a later collapse feel inevitable.' },
          { id: 'i8', lab: 'Varied sentence length', type: 'select', prompt: 'Varied sentence length', answer: 'D', why: 'Sentence length is pace. A long rushing sentence followed by a very short one creates a jolt.' },
          { id: 'i9', lab: 'Narrative perspective', type: 'select', prompt: 'Narrative perspective', answer: 'G', why: 'Perspective controls what the reader knows and how close they stand to the events.' }
        ] }
    ]
  },

  /* =========================================================== 2 TOOLKIT */
  {
    id: 's2', title: 'Writer’s toolkit', min: 10, due: 15,
    blocks: [
      { type: 'teach', title: 'Exposition', html: `
        <p>Exposition tells the reader where and when we are, who is here and what is at stake. Strong writers start close to the moment of trouble and let the reader infer the rest.</p>
        <ul><li>Choose <b>one or two telling details</b> and let them stand for the whole situation.</li>
        <li>Place the problem in the first paragraph, even if the reader only senses it.</li>
        <li>Save backstory for later and release it through action or dialogue.</li></ul>` },
      { type: 'activity', kind: 'quiz', id: 'q2', title: 'Which opening handles exposition best?',
        items: [
          { id: 'i1', lab: 'Choose the strongest opening', type: 'radio', prompt: 'Read the four openings for a story about a cabin damaged in a storm.',
            options: [
              '“My name is Ren, I am fifteen, and this is a story about the night the storm destroyed my grandfather’s cabin, which he built in 1994.”',
              '“The storm had gone by morning, but Ren still could not bring himself to touch the handle of the door that now leaned against the pines.”',
              '“There was once a cabin on a hill. It was old. A storm hit it. Ren was there.”',
              '“Ren felt very sad about the cabin, because a storm had wrecked it and he remembered many things about it.”'
            ],
            answer: '“The storm had gone by morning, but Ren still could not bring himself to touch the handle of the door that now leaned against the pines.”',
            why: 'This opening puts us in the aftermath, gives the time and place through one detail (the leaning door among the pines), hints at Ren’s feelings through what he cannot do, and leaves the backstory for later. The first option over-explains, the third is a list of flat facts, and the fourth names the feeling and gives the reason.' }
        ] },
      { type: 'activity', kind: 'write', id: 'w1', title: 'Improve this sentence: exposition', scan: 'expo',
        brief: 'Rewrite the sentence below in one or two sentences. Introduce the setting and the situation without over-explaining.',
        original: 'It was a rainy day in the town where Maya lived, and she was sad because her family had moved away and she had nothing to do.',
        fields: [{ id: 'a', label: 'Your rewrite', rows: 3, min: 10, ph: 'Start in the moment. Choose one telling detail.' }],
        looksLike: ['Concise (about 10 to 45 words).', 'Gives place and situation through one or two concrete details.', 'Leaves the emotion and the reasons for the reader to infer.', 'Starts in the moment.'],
        sample: '[[l:Rain drummed|A strong verb sets the weather and the mood together.]] on [[a:the empty carport where her father’s car used to sit|One object implies the whole situation: someone has left.]], and Maya [[c:counted puddles and had stopped counting days.|The unusual counting reveals her state of mind without naming it.]]',
        altNote: 'Another good rewrite might use a lonely object indoors, such as an unopened box or a phone that stays silent.' }
    ]
  , extra: [
      { type: 'teach', title: 'Characterisation: showing', html: `
        <p>Let the reader work out who a character is from evidence. There are five channels:</p>
        <ul class="cols2"><li><b>Action:</b> what they do, and how.</li><li><b>Dialogue:</b> what they say and avoid saying.</li><li><b>Thought:</b> what runs through their mind.</li><li><b>Objects:</b> what they carry, keep or lose.</li><li><b>Reaction:</b> how they respond to events and people.</li></ul>
        <p>Name a feeling only when you have no evidence to give. Evidence lands harder.</p>` },
      { type: 'activity', kind: 'quiz', id: 'q3', title: 'Which channel of characterisation is used?',
        lead: 'Choose the channel that dominates each line.',
        items: [
          { id: 'i1', lab: 'Line 1', type: 'select', prompt: '“Five more minutes,” he said, for the third time.', options: ['Action', 'Dialogue', 'Thought', 'Object', 'Reaction'], answer: 'Dialogue', why: 'The words, and the repetition, show a reluctance to leave.' },
          { id: 'i2', lab: 'Line 2', type: 'select', prompt: 'He wondered if the roof would still be there if he looked away.', options: ['Action', 'Dialogue', 'Thought', 'Object', 'Reaction'], answer: 'Thought', why: 'The reader enters his mind and sees the anxiety directly.' },
          { id: 'i3', lab: 'Line 3', type: 'select', prompt: 'Her father’s yellow cap sat on the dashboard, sun-bleached and untouched.', options: ['Action', 'Dialogue', 'Thought', 'Object', 'Reaction'], answer: 'Object', why: 'The cap carries the absence of the father. Nobody has moved it.' },
          { id: 'i4', lab: 'Line 4', type: 'select', prompt: 'At the word “flood”, Mira’s spoon stopped halfway to her mouth.', options: ['Action', 'Dialogue', 'Thought', 'Object', 'Reaction'], answer: 'Reaction', why: 'The frozen spoon is an involuntary response to news, so it reveals fear.' },
          { id: 'i5', lab: 'Line 5', type: 'select', prompt: 'He zipped the raincoat to his chin and walked straight into the deepest part of the puddle.', options: ['Action', 'Dialogue', 'Thought', 'Object', 'Reaction'], answer: 'Action', why: 'A deliberate physical choice shows defiance and appetite for risk.' }
        ] },
      { type: 'activity', kind: 'write', id: 'w2', title: 'Improve this sentence: showing', scan: 'show',
        brief: 'Rewrite the sentence so that the reader can tell how the boy feels from what he does, says, thinks or holds. Avoid naming the feelings.',
        original: 'The boy was scared and lonely.',
        fields: [{ id: 'a', label: 'Your rewrite', rows: 3, min: 8, ph: 'Use one action, one object or one line of dialogue.' }],
        looksLike: ['No named emotion (scared, lonely, sad, afraid).', 'Uses an action, object, body detail or dialogue.', 'Uses a precise verb.'],
        sample: 'The boy [[l:kept one hand on the doorframe|A precise action shows he is ready to bolt or to be found.]], [[c:listening for a car that never came.|The listening implies loneliness and waiting without naming either.]]',
        altNote: 'Other strong answers might use an object (a phone lit up, then dark) or a line of dialogue (“Is anyone else coming?”).' },

      { type: 'teach', title: 'Narrative style', html: `
        <p>Perspective decides whose mind we live in. Each choice changes the reader’s distance and knowledge.</p>
        <div class="tbl-wrap"><table class="plan"><thead><tr><th>Perspective</th><th>Marker</th><th>Typical effect</th></tr></thead><tbody>
          <tr><td>First person</td><td>I, me, my</td><td>Intimacy and voice. The reader knows only what the narrator knows, which allows blind spots.</td></tr>
          <tr><td>Third-person limited</td><td>she, he, they (one mind)</td><td>Close to one character’s thoughts, with a narrator just outside.</td></tr>
          <tr><td>Third-person omniscient</td><td>she, he, they (many minds)</td><td>A wide view across characters, places and time.</td></tr>
          <tr><td>Second person</td><td>you</td><td>Pulls the reader into the action, with urgency or accusation.</td></tr>
        </tbody></table></div>` },
      { type: 'activity', kind: 'quiz', id: 'q4', title: 'Identify the perspective',
        items: [
          { id: 'i1', lab: 'Line 1', type: 'select', prompt: 'I kept telling myself the hillside was solid, though my feet said otherwise.', options: ['First person', 'Third-person limited', 'Third-person omniscient', 'Second person'], answer: 'First person', why: 'The pronouns I, myself and my feet mark a narrator speaking about their own experience.' },
          { id: 'i2', lab: 'Line 2', type: 'select', prompt: 'Ana touched the cracked window and wondered why the glass had held when nothing else did.', options: ['First person', 'Third-person limited', 'Third-person omniscient', 'Second person'], answer: 'Third-person limited', why: 'We hear Ana’s thoughts and nobody else’s, filtered through a narrator.' },
          { id: 'i3', lab: 'Line 3', type: 'select', prompt: 'Ana did not yet know that the ground beneath the pines was already shifting, or that her brother, three valleys away, had felt it too.', options: ['First person', 'Third-person limited', 'Third-person omniscient', 'Second person'], answer: 'Third-person omniscient', why: 'The narrator knows more than Ana and moves to another character and place.' },
          { id: 'i4', lab: 'Line 4', type: 'select', prompt: 'You step onto the wet road and the whole street seems to hold its breath.', options: ['First person', 'Third-person limited', 'Third-person omniscient', 'Second person'], answer: 'Second person', why: 'The pronoun you turns the reader into the character.' }
        ] },
      { type: 'activity', kind: 'quiz', id: 'q5', title: 'Identify the effect of each perspective',
        lead: 'Choose the effect that best matches each perspective. Each effect is used once.',
        list: [
          ['A', 'Moves across characters, places and time, so the reader sees patterns the characters cannot.'],
          ['B', 'Puts us inside one narrator’s voice, which feels intimate and can be unreliable.'],
          ['C', 'Addresses the reader directly and pulls them into the action, with urgency or accusation.'],
          ['D', 'Stays close to one character’s thoughts while a narrator frames the scene from just outside.']
        ],
        letters: ['A', 'B', 'C', 'D'],
        items: [
          { id: 'i1', lab: 'First person', type: 'select', prompt: 'First person', answer: 'B', why: 'The narrator’s own voice creates intimacy, and their limited knowledge can mislead.' },
          { id: 'i2', lab: 'Third-person limited', type: 'select', prompt: 'Third-person limited', answer: 'D', why: 'Readers get one mind’s closeness with a narrator’s slight distance, a flexible choice for Task 2.' },
          { id: 'i3', lab: 'Third-person omniscient', type: 'select', prompt: 'Third-person omniscient', answer: 'A', why: 'The wide lens suits stories about systems, such as global issues that no single character sees.' },
          { id: 'i4', lab: 'Second person', type: 'select', prompt: 'Second person', answer: 'C', why: 'It is powerful in short doses, though it is hard to sustain across a longer piece.' }
        ] },

      { type: 'teach', title: 'Plot diagram', html: `
        <p>A short story needs movement. Aim for one clear turning point.</p>
        <ol class="four"><li><b>Exposition:</b> setting, protagonist, situation.</li><li><b>Rising action:</b> complications and mounting pressure (the inciting incident sits here).</li><li><b>Climax:</b> the moment of greatest tension, where a choice or discovery changes things.</li><li><b>Falling action:</b> the consequences.</li><li><b>Resolution:</b> a new balance, an open question or a final image.</li></ol>
        <p>In 300 to 450 words, spend your energy on the climax and the last image.</p>` },
      { type: 'activity', kind: 'quiz', id: 'q6', title: 'Place each event on the plot diagram',
        lead: 'These five events come from one short story. Choose the stage each event belongs to.',
        items: [
          { id: 'i1', lab: 'Event A', type: 'select', prompt: 'A surge floods the ground floor. Ilse must choose between saving her father’s old camera and helping him carry her grandmother to the stairs.', options: ['Exposition', 'Rising action', 'Climax', 'Falling action', 'Resolution'], answer: 'Climax', why: 'A forced choice at the point of highest tension is the climax.' },
          { id: 'i2', lab: 'Event B', type: 'select', prompt: 'Ilse and her father stack sandbags outside their seaside house as the sky darkens.', options: ['Exposition', 'Rising action', 'Climax', 'Falling action', 'Resolution'], answer: 'Exposition', why: 'It sets up place, characters and the coming threat.' },
          { id: 'i3', lab: 'Event C', type: 'select', prompt: 'Weeks later, Ilse plants dune grass along the new sea wall beside her father.', options: ['Exposition', 'Rising action', 'Climax', 'Falling action', 'Resolution'], answer: 'Resolution', why: 'A new balance and a closing image: the family now acts alongside the coast.' },
          { id: 'i4', lab: 'Event D', type: 'select', prompt: 'Each hour the water climbs higher, the neighbours drive away and her father refuses to leave.', options: ['Exposition', 'Rising action', 'Climax', 'Falling action', 'Resolution'], answer: 'Rising action', why: 'The pressure builds and complications multiply.' },
          { id: 'i5', lab: 'Event E', type: 'select', prompt: 'At dawn the water sinks, and the family sits on the roof sorting through what remains.', options: ['Exposition', 'Rising action', 'Climax', 'Falling action', 'Resolution'], answer: 'Falling action', why: 'The crisis has passed and we see its consequences.' }
        ] },

      { type: 'teach', title: 'Atmosphere and tone', html: `
        <p>Atmosphere is the feeling of a place. Tone is the writer’s attitude. Both are built from choices:</p>
        <ul class="cols2"><li><b>Diction:</b> violent, soft or clinical words.</li><li><b>Imagery:</b> sensory detail and comparisons.</li><li><b>Setting:</b> weather, light, objects, silence.</li><li><b>Sentence length:</b> pace and emphasis.</li></ul>` },
      { type: 'activity', kind: 'cloze', id: 'q7', title: 'Complete the analysis',
        quote: '“The cabin lay where the hillside had thrown it. Splintered slats. One curtain hanging from the broken window like a tongue. No sound but a single crow.”',
        lead: 'Choose the best word for each gap.',
        text: 'The verbs and adjectives “thrown” and “splintered” are violent {1}, which builds a {2} tone. The phrase “like a tongue” is a {3}, giving the wrecked cabin a wounded, human quality. The short {4} slow the pace and make each detail land separately. The final line uses {5} imagery, since the crow is the only sound, to emphasise the {6} of the place.',
        bank: ['auditory', 'bleak', 'cheerful', 'diction', 'emptiness', 'fragments', 'metaphor', 'simile', 'visual', 'warmth'],
        blanks: [
          { a: 'diction', why: 'Diction means word choice. Violent words such as thrown and splintered set the mood.' },
          { a: 'bleak', why: 'Wreckage, silence and no sign of comfort create a bleak tone.' },
          { a: 'simile', why: 'The comparing word like makes it a simile. A metaphor would state that the curtain was a tongue.' },
          { a: 'fragments', why: 'Sentence fragments without a verb work like still photographs.' },
          { a: 'auditory', why: 'Auditory imagery is about sound. The crow is the only sound.' },
          { a: 'emptiness', why: 'When one crow is the only sound, the reader feels the silence and emptiness around it.' }
        ] },
      { type: 'activity', kind: 'quiz', id: 'q8', title: 'Identify the effect of the technique',
        items: [
          { id: 'i1', lab: 'A sudden short sentence', type: 'radio', prompt: 'A writer follows a 40-word sentence packed with rushing water and drifting debris with a single word: “Silence.” What is the main effect?',
            options: ['A sudden pause that lets the reader feel the shock and the emptiness after the noise.', 'It shows the writer ran out of ideas.', 'It slows the story so that readers forget the flood.', 'It introduces a new character.'],
            answer: 'A sudden pause that lets the reader feel the shock and the emptiness after the noise.', why: 'Contrast in sentence length creates emphasis. The reader stops with the character.' },
          { id: 'i2', lab: 'Changing the tone', type: 'radio', prompt: 'Original: “The rain hammered the tin roof and the yard turned to grey sludge.” Which revision shifts the tone from bleak to hopeful?',
            options: ['The rain drummed on the tin roof, and beyond the fence a strip of clear sky was already brightening the wet leaves.', 'The rain hammered the tin roof and the yard turned to grey sludge, again.', 'The rain hammered the roof, and grey sludge covered the yard, so no one could go out.', 'The tin roof was hammered by rain and sludge.'],
            answer: 'The rain drummed on the tin roof, and beyond the fence a strip of clear sky was already brightening the wet leaves.', why: 'A softer verb (drummed) and the closing image of brightening leaves change the diction and the direction of the sentence.' }
        ] },

      { type: 'teach', title: 'Embedding the global context', html: `
        <p>A global context works best when it is <b>built into the story</b>. Four levers help:</p>
        <ul class="cols2"><li><b>Conflict:</b> a struggle that comes from the issue.</li><li><b>Setting:</b> a place that carries evidence of it.</li><li><b>Character choices:</b> decisions that reveal values.</li><li><b>Symbolism:</b> an object or image that stands for the connection.</li></ul>
        <p>Show how a <b>local moment connects to a bigger system</b>: one beach, one drain, one label on a crate. Let readers make the link.</p>` },
      { type: 'activity', kind: 'quiz', id: 'q9', title: 'Which line embeds the global context best?',
        items: [
          { id: 'i1', lab: 'Choose the strongest line', type: 'radio', prompt: 'The global context for this workshop is globalization and sustainability.',
            options: [
              '“This story shows why globalization and sustainability matter to every person on Earth.”',
              '“Humans must stop destroying the planet, the narrator thought, and everybody should recycle more.”',
              '“Beyond the fence, the beach was a shelf of bottle caps, flip-flops and fishing nets, washed in from countries no one in the village had ever visited.”',
              '“The teacher explained that the ocean was polluted and that pollution was a serious global problem.”'
            ],
            answer: '“Beyond the fence, the beach was a shelf of bottle caps, flip-flops and fishing nets, washed in from countries no one in the village had ever visited.”',
            why: 'The third line embeds the context in the setting. Concrete objects show a link between a local shore and far-off places, and the reader draws the conclusion. The other three announce the theme, lecture, or summarise it.' }
        ] },
      { type: 'activity', kind: 'quiz', id: 'q10', title: 'Which lever is each example using?',
        items: [
          { id: 'i1', lab: 'Example 1', type: 'select', prompt: 'The mayor needs the cruise ships for jobs. The cruise ships are what is filling the harbour with oil.', options: ['Conflict', 'Setting', 'Character choice', 'Symbol'], answer: 'Conflict', why: 'Two needs pull against each other, and the tension comes from the issue itself.' },
          { id: 'i2', lab: 'Example 2', type: 'select', prompt: 'Solar panels covered the old village square in perfect rows, humming above the faded chalk marks of a children’s game.', options: ['Conflict', 'Setting', 'Character choice', 'Symbol'], answer: 'Setting', why: 'The place carries evidence of change: new energy replacing an old shared space.' },
          { id: 'i3', lab: 'Example 3', type: 'select', prompt: 'Rafa knew the export price for the coral would feed his family for a month. He left it on the reef and told the buyer it had died.', options: ['Conflict', 'Setting', 'Character choice', 'Symbol'], answer: 'Character choice', why: 'A decision under pressure reveals values and moves the plot.' },
          { id: 'i4', lab: 'Example 4', type: 'select', prompt: 'A plastic bottle, bleached white, passed the boat every evening, as regular as the tide.', options: ['Conflict', 'Setting', 'Character choice', 'Symbol'], answer: 'Symbol', why: 'A recurring object becomes a motif that carries the idea of waste travelling across oceans.' }
        ] }
    ]
  },

  /* =========================================================== 3 PLANNING */
  {
    id: 's3', title: 'Image planning', min: 10, due: 25,
    blocks: [
      { type: 'chooser' },
      { type: 'activity', kind: 'plan', id: 'pa', title: 'Plan A: read the image',
        brief: 'Look closely at your image. Give specific details in each answer.',
        fields: [
          { id: 'lit', label: 'What is literally happening in the image?', rows: 3, min: 12, ph: 'Describe what you can see: people, objects, place, weather, light.' },
          { id: 'before', label: 'What might have happened immediately before this moment?', rows: 2, min: 10, ph: 'One or two events that led here.' },
          { id: 'next', label: 'What could happen next?', rows: 2, min: 10, ph: 'The next action, discovery or decision.' }
        ],
        examples: {
          1: {
            lit: 'A wooden cabin lies toppled on its side on a wooded hillside on a bright autumn day. Its window is smashed with a curtain hanging out, the deck slats are splayed, and a car and a metal box sit in the undergrowth behind it.',
            before: 'Days of record rain saturated the slope, and a landslide slid the cabin off its footings during the night. Above it, the ridge had been cleared of trees months earlier.',
            next: 'The family climbs up to assess the damage. A company letter offers compensation, and someone has to decide whether to sign it.'
          },
          2: {
            lit: 'A small child in a yellow raincoat and flowered boots crouches at a large puddle on a wet suburban street, hands touching the water so that ripples spread. Their reflection hangs upside down below them.',
            before: 'Heavy rain has fallen for days and the street has flooded before. Lina slipped outside alone while her father was on the phone about the river level.',
            next: 'The drain at the corner is blocked. Her father will call her in, and she will try to fix the problem herself.'
          }
        } },
      { type: 'activity', kind: 'plan', id: 'pb', title: 'Plan B: character and conflict',
        brief: 'Decide who your story follows and what stands in their way.',
        fields: [
          { id: 'prot', label: 'Who is the protagonist?', rows: 2, min: 8, ph: 'Name, age, one telling habit or belief.' },
          { id: 'want', label: 'What does the protagonist want, fear or need?', rows: 3, min: 12, ph: 'Want (surface), fear (obstacle), need (deeper truth).' },
          { id: 'conf', label: 'What is the central conflict?', rows: 2, min: 10, ph: 'Who or what stands against the protagonist?' }
        ],
        examples: {
          1: {
            prot: 'Mio, 15, granddaughter of the man who built the cabin. She notices details others walk past and keeps her grandfather’s habit of tapping tree trunks.',
            want: 'Wants: to know who is responsible. Fears: that her family will accept money and stop asking questions. Needs: to see that a local disaster is linked to decisions made far away, and to act.',
            conf: 'Mio against her mother, who wants to settle and move on, and Mio against a distant timber company whose logging loosened the hill.'
          },
          2: {
            prot: 'Lina, seven, curious and stubborn, a girl who treats every puddle as a question.',
            want: 'Wants: to find out where the water goes. Fears: the sound of her father’s tight voice. Needs: to understand that the flooding has causes and that small actions and big systems are linked.',
            conf: 'Lina’s wonder against her parents’ worry, and a neighbourhood against water that has nowhere left to go.'
          }
        } },
      { type: 'activity', kind: 'plan', id: 'pc', title: 'Plan C: meaning, voice and context',
        brief: 'Turn details into symbols, choose your narrator and connect to the global context.',
        fields: [
          { id: 'sym', label: 'Which details from the image will become meaningful symbols or motifs?', rows: 3, min: 12, ph: 'Choose two or three, and say what each could stand for.' },
          { id: 'pov', label: 'Which narrative perspective will you use, and why?', rows: 2, min: 12, ph: 'First person, third limited, omniscient or second person, with a reason.' },
          { id: 'gc', label: 'How will the global context shape the story?', rows: 3, min: 15, ph: 'Name the lever(s): conflict, setting, character choice, symbol.' }
        ],
        examples: {
          1: {
            sym: 'The yellow curtain (a handmade home caught between inside and outside). The stumps on the ridge (missing roots). The tilted floor (a world knocked off balance). A blue EXPORT GRADE stamp on a plank (far-away markets).',
            pov: 'Third-person limited on Mio. It keeps us close to her observations and lets readers connect the clues (stumps, stamp, letter) before she says them aloud.',
            gc: 'Conflict: a local landslide linked to global timber export. Setting: the cleared ridge above the cabin. Choice: Mio decides to plant before signing anything. Symbol: the export stamp and the curtain flag.'
          },
          2: {
            sym: 'Ripples (effects spreading outward across the world). The reflection (an upside-down future). The yellow coat (a small bright warning). The stop sign (a limit ignored). A crisp packet blocking the drain (everyday waste with large consequences).',
            pov: 'First person, retrospective: adult Lina remembering being seven. It gives an innocent voice with an adult’s later understanding, which suits a story where causes are revealed slowly.',
            gc: 'Conflict: repeated flooding after houses were built over a marsh. Setting: the street at the end of a new estate. Choice: Lina frees the drain. Symbol: ripples that spread outward.'
          }
        } },
      { type: 'activity', kind: 'plan', id: 'pd', title: 'Plot diagram planner',
        brief: 'Sketch your plot in five moves. One line each is enough. Give special care to the climax.',
        fields: [
          { id: 'expo', label: 'Exposition', rows: 2, min: 8, ph: 'Where, when, who, what is normal?' },
          { id: 'inc', label: 'Inciting incident', rows: 2, min: 8, ph: 'The event or discovery that starts the trouble.' },
          { id: 'rise', label: 'Rising action', rows: 2, min: 8, ph: 'Complications, pressure, a choice looming.' },
          { id: 'climax', label: 'Climax', rows: 2, min: 8, ph: 'The moment of decision, discovery or loss.' },
          { id: 'res', label: 'Resolution', rows: 2, min: 8, ph: 'The final image or the new balance.' }
        ],
        examples: {
          1: {
            expo: 'Mio and her mother climb to the toppled cabin the morning after the slide: tape, sunlight, a crow.',
            inc: 'Mio spots the timber company’s letter in her mother’s hand and the pale line of stumps on the ridge.',
            rise: 'She finds the blue EXPORT stamp on a plank, remembers her grandfather’s warning about roots and argues with her mother about signing.',
            climax: 'Mio takes the curtain from the broken window and ties it to a stump on the ridge, choosing to act.',
            res: 'She asks her mother to plant before signing anything. The hill creaks as if listening.'
          },
          2: {
            expo: 'Lina, seven, crouches at the fifth puddle of the month at the end of Marsh Lane.',
            inc: 'A crisp packet drifts to the drain and the water starts to rise.',
            rise: 'Her father calls her in and explains that the new estate was built on the marsh, and the water climbs her boot.',
            climax: 'Lina frees the packet and the puddle drains, but her father’s face shows that one small fix will not be enough.',
            res: 'Years later the narrator lives uphill and still watches ripples spread, asking who stands on the far shore.'
          }
        } }
    ]
  },

  /* =========================================================== 4 CRAFT */
  {
    id: 's4', title: 'Craft challenge', min: 8, due: 33,

  function senseCount(t) { return Object.keys(SENSES).filter(function (k) { return SENSES[k].test(t); }).length; }
  function overlap(a, b) {
    var A = (a.toLowerCase().match(/[a-z’']+/g) || []), B = {};
    (b.toLowerCase().match(/[a-z’']+/g) || []).forEach(function (w) { B[w] = 1; });
    if (!A.length) { return 0; }
    return A.filter(function (w) { return B[w]; }).length / A.length;
  }
  function imgWords() { return (CFG.imageWords || [])[Math.max(0, st.img - 1)] || []; }
  function ctxWords() { return CFG.contextWords || []; }
  function variety(t, shortMax, longMin) {
    var lens = sentences(t).map(words);
    return lens.length > 1 && Math.min.apply(null, lens) <= shortMax && Math.max.apply(null, lens) >= longMin;
  }

  function scanWrite(b, text) {
    var out = [], t = text || '', wc = words(t);
    function add(ok, label, tip) { out.push({ ok: ok, label: label, tip: tip }); }
    var emo = rxCount(EMO, t);
    var orig = b.byImage && b.byImage[st.img] && b.byImage[st.img].original || b.original || '';
    if (b.scan === 'expo') {
      add(wc >= 10 && wc <= 45, 'Concise: ' + wc + ' words (aim for 10 to 45)', 'Trim to one or two sentences. Keep one or two telling details.');
      add(!/^\s*(it was a|there was|once upon|one day|my name is|it is a)/i.test(t), 'Starts in the moment', 'Avoid formula openings such as “It was a…”. Begin with a detail or an action.');
      add(emo === 0, 'Names no emotion outright', 'Remove named feelings (sad, lonely, angry). Let one object or action imply the feeling.');
      add(/\b(in|on|at|under|behind|beyond|across|outside|inside|over|beside|by|near|through|above|below|along|beneath)\b/i.test(t), 'Places the reader in a setting', 'Add a place marker: where exactly is Maya standing, sitting or looking?');
      add(overlap(t, orig) < 0.7, 'Rewritten in your own words', 'Your version repeats most of the original. Choose new words and one new detail.');
    } else if (b.scan === 'show') {
      add(emo === 0, 'Names no emotion outright', 'Delete words such as scared, lonely, angry, excited. Replace them with evidence.');
      add(rxCount(BODY, t) > 0 || (t.match(QUOTE) || []).length > 0 || /\b(shook|stared|gripped|pressed|counted|watched|listened|kept|stood|sat)\b/i.test(t), 'Uses an action, body detail or speech', 'Add something we could see or hear: a hand, a breath, an object, a spoken line.');
      add(overlap(t, orig) < 0.7, 'Rewritten in your own words', 'Your version repeats most of the original. Start again from the feeling and look for evidence.');
      add(rxCount(/\b\w{4,}(ed|ing)\b/gi, t) >= 1 || /\b(shook|stood|sat|kept|held|ran|hid|froze|slid|clung|spun)\b/i.test(t), 'Uses a precise verb', 'Replace a plain verb (was, felt, looked) with a specific one (gripped, pressed, counted).');
      add(wc >= 8, 'Long enough to carry evidence (' + wc + ' words)', 'Add one more concrete detail.');
    } else if (b.scan === 'open') {
      add(wc >= 40 && wc <= 60, 'Length: ' + wc + ' words (aim for 40 to 60)', 'Adjust to 40 to 60 words. Cut explanation or add one more sensory detail.');
      add(senseCount(t) >= 2, 'At least two senses used (' + senseCount(t) + ' found)', 'Add sound, touch or smell to your sight details.');
      add(hits(imgWords(), t) >= 1, 'Uses a detail from your image', 'Bring in one concrete detail from the picture, such as an object or a colour.');
      add(emo === 0 && !/\b(because|which meant|this was why)\b/i.test(t), 'Explains little and names no emotion', 'Delete “because” explanations and named feelings. Let the reader wonder.');
      add(variety(t, 7, 14), 'Sentence length varies', 'Add one very short sentence beside a longer one to create rhythm.');
    } else if (b.scan === 'dialogue') {
      var qs = (t.match(QUOTE) || []);
      var lines = t.split('\n').filter(function (l) { return /[“"]/.test(l); });
      var ql = qs.map(words);
      add(Math.max(qs.length, lines.length) >= 3, 'Three quoted lines (' + Math.max(qs.length, lines.length) + ' found)', 'Write three separate lines, each inside quotation marks.');
      add(ql.length > 1 && Math.max.apply(null, ql) - Math.min.apply(null, ql) >= 3, 'Lines differ in length', 'Make one line very short and one longer so that the rhythm varies.');
      add(/\?|\u2014|\u2013|\.\.\.|…|\b(anyway|whatever|fine|never mind|it’s nothing|it's nothing|later|forget it|not now|drop it|enough|please|now|listen|look|come|stop|wait)\b/i.test(t), 'Includes a question, deflection or interruption', 'Add a question that goes unanswered, or a line that changes the subject.');
      add(!/\b(i feel|i’m (so |very )?(angry|sad|scared|afraid|upset|worried|furious)|i'm (so |very )?(angry|sad|scared|afraid|upset|worried|furious)|i am (so |very )?(angry|sad|scared|afraid|upset|worried))\b/i.test(t), 'Feelings stay under the surface', 'Replace lines that announce a feeling with lines about something else.');
      add(wc >= 12, 'Enough material to show conflict (' + wc + ' words)', 'Add a little more so that the conflict has room.');
    } else if (b.scan === 'symbol') {
      add(wc >= 10 && wc <= 60, 'Length: ' + wc + ' words (aim for 10 to 60)', 'Use one or two focused sentences.');
      add(hits(imgWords(), t) + hits(['stamp', 'packet', 'plank', 'letter', 'bottle', 'label', 'crate', 'coat', 'boots', 'curtain', 'stump', 'sign'], t) >= 1, 'A concrete object appears', 'Name one specific object and describe it precisely.');
      add(hits(ctxWords(), t) >= 1, 'Links to the global context', 'Add a detail that points beyond the local scene: trade, waste, weather, resources or distance.');
      add(!/\b(symbolis|symboliz|represent|stands? for|meant that|which meant|reminded (him|her|me|them) (that|of)|this showed|shows that)\w*/i.test(t), 'Leaves the meaning for the reader', 'Delete any sentence that explains what the object means.');
    }
    return out;
  }

  var CAT_TITLES = [
    ['connection', 'Connection to the image and the global context'],
    ['structure', 'Narrative structure and plot'],
    ['character', 'Characterisation'],
    ['voice', 'Narrative voice and style'],
    ['language', 'Language choices and atmosphere'],
    ['technical', 'Technical accuracy']
  ];
  function scanFinal(text) {
    var t = text || '', wc = words(t), nq = noQuote(t), cats = {};
    function cat(k) { cats[k] = cats[k] || []; return function (ok, label, tip) { cats[k].push({ ok: ok, label: label, tip: tip }); }; }
    var paras = t.split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
    var sents = sentences(t), lens = sents.map(words);

    var c = cat('connection');
    var ih = hits(imgWords(), t), ch = hits(ctxWords(), t);
    c(ih >= 3, 'Uses details from your chosen image (' + ih + ' found)', 'Bring in more specific details from the image and give each a job in the story.');
    c(ch >= 2, 'Concrete details point to the global context (' + ch + ' found)', 'Add objects, places or decisions that link a local moment to a wider system, such as trade, waste, weather, resources or distance.');
    c(!/\b(globali[sz]ation|sustainability|global warming|climate change|the theme|this story (shows|is about)|the moral|the message)\b/i.test(t), 'The context works through events and objects', 'Delete sentences that name the theme. Let a decision or an object carry it.');

    c = cat('structure');
    c(wc >= 300 && wc <= 450, 'Length: ' + wc + ' words (aim for 300 to 450)', wc < 300 ? 'Add a complication or expand the climax.' : 'Cut description that repeats itself.');
    c(paras.length >= 3, 'Paragraphs: ' + paras.length + ' (aim for at least three)', 'Start a new paragraph at each shift of time, place, speaker or mood.');
    var tail = t.slice(Math.floor(t.length * 0.55));
    var turn = rxCount(/\b(decided|chose|refused|realised|realized|understood|discovered|found|lifted|tied|pulled|freed|opened|signed|left|climbed|waded|gave|took|stopped|turned|planted|whispered|ran|nodded|finally|at last|for the first time|no longer|until|but)\b/gi, tail);
    c(turn >= 3, 'Something changes in the second half (' + turn + ' change signals)', 'Build a clear turning point: a decision, a discovery or a loss in the second half.');
    var lastP = paras[paras.length - 1] || '';
    c(words(lastP) > 0 && words(lastP) <= 90, 'A compact closing paragraph', 'End with a short final paragraph or a single closing image.');

    c = cat('character');
    var caps = {}, m = t.match(/\b[A-Z][a-z]{2,}\b/g) || [];
    m.forEach(function (w) { if (STOPCAP.indexOf(w) < 0) { caps[w] = (caps[w] || 0) + 1; } });
    var top = Object.keys(caps).some(function (w) { return caps[w] >= 3; });
    var first = rxCount(/\b(i|me|my|mine|myself|we|our|us)\b/gi, nq);
    c(top || first >= 5, 'A clear protagonist is present', 'Name your protagonist early and keep the focus on them.');
    c(rxCount(BODY, t) >= 3, 'Shows character through action and body detail (' + rxCount(BODY, t) + ' found)', 'Add gestures, movements and small physical reactions.');
    c((t.match(QUOTE) || []).length >= 2, 'Dialogue reveals character (' + (t.match(QUOTE) || []).length + ' quoted lines)', 'Add two or three lines of speech in which characters disagree or hold something back.');
    c(rxCount(EMO, t) <= 2, 'Few named emotions (' + rxCount(EMO, t) + ' found)', 'Replace named feelings with evidence the reader can see or hear.');

    c = cat('voice');
    var third = rxCount(/\b(he|she|him|her|his|hers|they|them|their)\b/gi, nq);
    var pn = first + third;
    c(pn < 5 || Math.min(first, third) / pn < 0.35, 'Perspective stays consistent', 'Check each sentence. Choose first person or third person and hold it, unless you switch on purpose.');
    var past = rxCount(/\b(was|were|had|did|went|said|came|saw|took|stood|felt|knew|thought)\b|\b\w{3,}ed\b/gi, nq);
    var pres = rxCount(/\b(is|are|am|has|does|goes|says|comes|sees|takes|stands|feels|knows|thinks)\b/gi, nq);
    c(past + pres < 8 || Math.min(past, pres) / (past + pres) < 0.25, 'Tense stays consistent', 'Choose past or present tense and check every verb. A retrospective ending can shift tense on purpose.');
    c(lens.length > 3 && Math.min.apply(null, lens) <= 5 && Math.max.apply(null, lens) >= 20, 'Sentence length varies', 'Place a very short sentence beside a long one at the moment of highest tension.');
    var reg = rxCount(/\b(really|very|stuff|kind of|sort of|a lot of|lots of|gonna|wanna)\b/gi, nq);
    c(reg <= 2, 'Controlled register (' + reg + ' casual fillers)', 'Cut fillers such as “really” and “very”, and choose precise words instead.');

    c = cat('language');
    c(senseCount(t) >= 3, 'Sensory range: ' + senseCount(t) + ' senses (aim for at least three)', 'Add sound, touch or smell to your sight details.');
    c(rxCount(/\b(like (an? |the |his |her |my |their )|as if|as though|as \w+ as|\w+ as an? \w+)|\b(the|its|his|her) \w+( \w+)? (gulped|sighed|whispered|shivered|listened|swallowed|complained|breathed|waited|watched|remembered|forgot|groaned|wept|murmured|held its breath)\b/gi, t) >= 1, 'Figurative language appears', 'Add one simile, metaphor or piece of personification that fits the mood.');
    var weak = rxCount(/\b(was|were|got|went|looked|seemed|very|really|suddenly|walked)\b/gi, nq);
    c(wc > 0 && weak / wc * 100 <= 5.5, 'Precise verbs (' + (wc ? (weak / wc * 100).toFixed(1) : 0) + ' plain verbs per 100 words)', 'Replace plain verbs (was, went, looked) with specific ones.');
    var ly = rxCount(/\b\w{4,}ly\b/gi, nq);
    c(wc > 0 && ly / wc * 100 <= 2.5, 'Adverbs under control (' + ly + ' found)', 'Trim adverbs. A stronger verb often does the same job.');

    c = cat('technical');
    var caps2 = sents.filter(function (s) { return /^[“"‘'(]?[A-Z0-9]/.test(s); }).length;
    c(!sents.length || caps2 / sents.length >= 0.95, 'Sentences begin with capital letters', 'Check that each sentence starts with a capital letter.');
    c(!/(^|[^A-Za-z’'])i(\s|’|')/.test(t) && !/\b(u|ur|gonna|wanna|cos|idk|lol|omg)\b/i.test(t), 'No lower-case “i” or text-speak', 'Change lower-case “i” to “I” and replace text-speak with full words.');
    var qq = t.match(QUOTE) || [];
    c(!qq.length || qq.filter(function (q) { return /[,.!?…\u2014-][”"]$/.test(q); }).length / qq.length >= 0.8, 'Dialogue is punctuated inside the quotation marks', 'End each spoken line with a comma, full stop, question mark or dash before the closing quotation mark.');
    c(/[.!?…”"’]\s*$/.test(t.trim()) && t.trim().length > 0, 'The piece ends with proper punctuation', 'Finish with a full stop or another closing mark.');
    c(!lens.length || Math.max.apply(null, lens) <= 60, 'No overlong sentences', 'Split any sentence longer than about 60 words unless you have built it on purpose.');
    return cats;
  }
  function catSummary(cats) {
    var rows = CAT_TITLES.map(function (x) {

    });

    return { rows: rows, next: NEXT_STEPS[key], nextKey: key };
  }

  /* ---------------- shell: clock and bars ---------------- */
  function nextSec() {
    for (var i = 0; i < SECTIONS.length - 1; i++) { if (!secDone(SECTIONS[i])) { return SECTIONS[i]; } }
    return null;
  }
  function buildBars() {
    var ticks = '', cum = 0, segs = '';
    SECTIONS.slice(0, 5).forEach(function (s, i) {
      cum = s.due;
      if (i < 4) { ticks += '<b style="left:' + (cum / TOTAL_MIN * 100).toFixed(2) + '%"></b>'; }
      segs += '<div class="seg" id="seg-' + s.id + '" style="flex:' + s.min + '" title="' + esc(s.title) + '"><i></i></div>';
    });
    $('#bars').innerHTML = '<span class="lbl">Time</span><div class="track" aria-hidden="true"><i id="trackFill"></i>' + ticks + '</div>' +
      '<span class="lbl" id="progL">Progress</span><div class="segs" id="segs" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Workshop progress">' + segs + '</div>';
  }
  function updateProgress() {
    var done = 0, all = 0;
    SECTIONS.slice(0, 5).forEach(function (s) {
      var f = secFrac(s), seg = $('#seg-' + s.id);
      done += s.acts.filter(actDone).length; all += s.acts.length;
      if (seg) { seg.firstChild.style.width = (f * 100) + '%'; seg.setAttribute('data-full', f === 1 ? '1' : '0'); }
    });
    var L = $('#progL'), P = $('#segs');
    if (L) { L.textContent = done + '/' + all; }
    if (P) { P.setAttribute('aria-valuenow', String(Math.round(done / all * 100))); P.setAttribute('aria-valuetext', done + ' of ' + all + ' tasks complete'); }
  }
  function tick() {
    var el = elapsed(), rem = TOTAL - el;
    var T = $('#clockT'), C = $('#clock'), F = $('#trackFill'), P = $('#pace');
    if (!T) { return; }
    T.textContent = st.start ? (rem >= 0 ? fmt(rem) : '+' + fmt(-rem)) : fmt(TOTAL);
    $('#clockL').textContent = !st.start ? 'not started' : (rem >= 0 ? 'remaining' : 'over time');
    C.setAttribute('data-s', !st.start ? 'idle' : rem < 0 ? 'over' : rem < 300000 ? 'warn' : 'run');
    F.style.width = Math.min(100, el / TOTAL * 100) + '%';
    var tg = nextSec(), h;
    if (!st.start) {
      h = '<span>Read the task below, then press Start clock. You have ' + TOTAL_MIN + ' minutes.</span>';
    } else if (!tg) {
      h = '<span class="pill ok">Sections 1 to 5 complete</span><span>Open Finish, download your PDF and hand it in.</span>';
    } else {
      var min = el / 60000, due = tg.due, pill;
      if (min <= due) { pill = '<span class="pill ok">' + Math.max(0, Math.ceil(due - min)) + ' min to target</span>'; }
      else { pill = '<span class="pill ' + (rem < 0 ? 'over' : 'late') + '">' + Math.max(1, Math.round(min - due)) + ' min behind</span>'; }
      h = '<span>Now: <b>' + esc(tg.title) + '</b>, finish by ' + due + ':00</span>' + pill;
    }
    if (P.getAttribute('data-k') !== h) { P.innerHTML = h; P.setAttribute('data-k', h); }
  }

  function secHead(sec) {

      (st.img ? '<span class="thumb"><span class="hint">Your image</span>' + (imgSrc(st.img - 1) ? '<img src="' + esc(imgSrc(st.img - 1)) + '" alt="">' : '') + '<b>' + esc(imgLabel(st.img)) + '</b></span>' : '') + '</div>' +

  function viewSection(sec) {

      '<button class="btn btn-primary" data-act="next">' + (last ? 'Next section: ' + esc(nx ? nx.title : '') : 'Next: ' + esc(sec.chunks[ci + 1].title)) + '</button></nav>';

        if (!actDone(b)) { add('h2', b.title + ' (not submitted)'); return; }
        if (b.kind === 'quiz' || b.kind === 'cloze') {
          var sc = score(b); add('h2', b.title + ' (' + sc.got + ' of ' + sc.total + ')');
          actText(b).forEach(function (l) { add('li', l); });
        } else if (b.kind === 'write') {
          var res = scanWrite(b, (st.w[b.id] || {}).a), n = res.filter(function (r) { return r.ok; }).length;
          add('h2', b.title + ' (feedback signals ' + n + ' of ' + res.length + ')');
          var o = pickOf(b, 'original'); if (o) { add('h3', 'Original sentence'); add('p', o); }
          add('h3', 'My writing'); add('p', (st.w[b.id] || {}).a || '');
          if ((st.tk[b.id] || []).filter(Boolean).length) { add('h3', 'Self-check'); add('li', (st.tk[b.id] || []).filter(Boolean).length + ' of ' + b.looksLike.length + ' statements ticked'); }
        } else if (b.kind === 'plan') {
          add('h2', b.title);
          b.fields.forEach(function (f) { add('h3', f.label); add('p', (st.w[b.id] || {})[f.id] || ''); });
        } else if (b.kind === 'final') {
          var txt = (st.w.final || {}).a || '', cs = catSummary(scanFinal(txt));
          add('h2', 'Final story (' + words(txt) + ' words, ' + imgLabel(st.img) + ')');
          txt.split(/\n+/).forEach(function (p) { if (p.trim()) { add('p', p.trim()); } });
          add('h3', 'Success checklist: ' + (st.pre || []).filter(Boolean).length + ' of ' + PRE_CHECK.length + ' ticked');
          add('h3', 'Feedback summary (keyword-based)');
          cs.rows.forEach(function (r) { add('li', r.title + ': ' + r.ok + ' of ' + r.total + ' signals'); });
          add('h3', 'Next step'); add('p', cs.next);
          if (st.rev.final) { add('h3', 'Move borrowed from a model'); add('p', st.rev.final); }
        }
      });
    });
    if (st.refl) { add('h1', 'Reflection'); add('p', st.refl); }
    return B;
  }
  function buildReport() {
    return reportBlocks().map(function (b) {
      if (b.t === 'h1') { return '\n=== ' + b.x.toUpperCase() + ' ==='; }
      if (b.t === 'h2') { return '\n' + b.x; }
      if (b.t === 'title') { return b.x.toUpperCase(); }
      return b.x;
    }).join('\n');
  }
  function pdfSafe(str) {
    return String(str).replace(/\r/g, '').replace(/\t/g, '  ').replace(/[^\x0A\x20-\x7E\xA0-\xFF–‘’“”•…€™]/g, '?');
  }
  function makePdf() {
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) { throw new Error('PDF library missing'); }
    var doc = new J({ unit: 'mm', format: 'a4' });
    var PW = 210, PH = 297, M = 18, maxW = PW - 2 * M, y = M, pageNo = 1, name = (st.name || '').trim();
    function footer() {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
      doc.text('Task 2 creative writing workshop' + (name ? ' | ' + pdfSafe(name) : ''), M, PH - 9);
      doc.text('Page ' + pageNo, PW - M, PH - 9, { align: 'right' });
      doc.setTextColor(20);
    }
    function needH(h) { if (y + h > PH - M - 4) { footer(); doc.addPage(); pageNo++; y = M; } }
    function put(str, size, style, before, after, indent, color) {
      doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(color || 20);
      var lh = size * 0.3528 * 1.4; y += before;
      doc.splitTextToSize(pdfSafe(str), maxW - indent).forEach(function (l) { needH(lh); doc.text(l, M + indent, y + size * 0.3528); y += lh; });
      y += after;
    }
    reportBlocks().forEach(function (b) {
      if (b.t === 'title') { put(b.x, 18, 'bold', 0, 3, 0); }
      else if (b.t === 'meta') { put(b.x, 10, 'normal', 0, 0.5, 0, 90); }
      else if (b.t === 'h1') { needH(20); put(b.x, 14, 'bold', 7, 1, 0); doc.setDrawColor(200, 150, 0); doc.setLineWidth(0.6); doc.line(M, y, PW - M, y); y += 1; }
      else if (b.t === 'h2') { needH(14); put(b.x, 11, 'bold', 4, 1.2, 0); }
      else if (b.t === 'h3') { put(b.x, 9.5, 'bold', 1, 0.5, 3, 80); }
      else if (b.t === 'li') { put(b.x, 9.5, 'normal', 0, 0.8, 3); }
      else { put(b.x, 10.5, 'normal', 0, 2, 3); }
    });
    footer();
    return doc;
  }
  function pdfName() {
    var n = ((st.name || '').trim() || 'student').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return 'Task2_Workshop_' + (n || 'student') + '.pdf';
  }

  /* ---------------- render and navigation ---------------- */
  var app = $('#app');
  function render() {
    renderTabs();
    app.innerHTML = st.sec === 'start' ? viewStart() : viewSection(SECTIONS.filter(function (s) { return s.id === st.sec; })[0] || SECTIONS[0]);
    var b = $('#btnStart'), r = $('#btnReset');
    if (b) { b.hidden = !!st.start; }
    if (r) { r.hidden = !st.start; }
    updateProgress(); tick();
  }
  function toTop() {
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
  }
  function scrollToId(id) {
    var el = document.getElementById(id); if (!el) { return; }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); }
  }
  function gotoSec(id, part) {
    st.sec = id; if (part != null) { st.part[id] = part; }
    save(); render(); toTop();
  }
  function curSec() { return SECTIONS.filter(function (s) { return s.id === st.sec; })[0]; }
  function startClock() { if (st.start) { return; } st.start = Date.now(); save(); render(); }
  var resetTimer = null;
  function resetClock() {
    var r = $('#btnReset');
    if (r.getAttribute('data-arm') === '1') { clearTimeout(resetTimer); st.start = null; save(); render(); }
    else {
      r.setAttribute('data-arm', '1'); r.textContent = 'Confirm reset';
      resetTimer = setTimeout(function () { r.removeAttribute('data-arm'); r.textContent = 'Reset'; }, 4000);
    }
  }

  /* ---------------- events ---------------- */
  function refreshSubmit(id) {
    var x = BYID[id]; if (!x) { return; }
    var btn = document.getElementById('sub-' + id); if (!btn) { return; }
    if (x.b.kind === 'quiz' || x.b.kind === 'cloze') {
      btn.disabled = !answeredAll(x.b);
      var c = document.getElementById('cnt-' + id); if (c) { c.textContent = answeredCount(x.b) + ' of ' + totalItems(x.b) + ' answered'; }
    } else { btn.disabled = !writeReady(x.b); }
  }
  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'nm') { st.name = el.value; save(); return; }
    if (el.id === 'refl') { st.refl = el.value; save(); return; }
    var sid = el.getAttribute('data-step');
    if (el.getAttribute('data-field')) {
      var fid = el.getAttribute('data-field');
      st.w[sid] = st.w[sid] || {}; st.w[sid][fid] = el.value; save();
      var wc = words(el.value), out = document.getElementById('wc-' + sid + '-' + fid), b = BYID[sid].b;
      if (out) {
        if (sid === 'final') { out.textContent = finalCounter(wc); out.className = 'wc ' + wcClass(wc); }
        else {
          var f = b.fields.filter(function (q) { return q.id === fid; })[0];
          out.textContent = counterText(f, wc); out.className = 'wc' + (fieldReady(b, f) ? ' met' : '');
        }
      }
      refreshSubmit(sid);
    } else if (el.getAttribute('data-rev')) { st.rev[sid] = el.value; save(); }
  });
  app.addEventListener('change', function (e) {
    var el = e.target, sid = el.getAttribute('data-step');
    if (el.getAttribute('data-pre') != null) {
      st.pre = st.pre || []; st.pre[+el.getAttribute('data-pre')] = el.checked; save();
      var pc = document.getElementById('prec'); if (pc) { pc.textContent = st.pre.filter(Boolean).length + ' of ' + PRE_CHECK.length; }
      return;
    }
    if (!sid) { return; }
    st.a[sid] = st.a[sid] || {};
    if (el.type === 'radio') {
      st.a[sid][el.getAttribute('data-item')] = el.getAttribute('data-val');
      var grp = el.closest('.opts');
      if (grp) { Array.prototype.forEach.call(grp.querySelectorAll('.opt'), function (o) { o.classList.toggle('sel', o.querySelector('input').checked); }); }
    } else if (el.classList.contains('pick')) { st.a[sid][el.getAttribute('data-item')] = el.value; }
    else if (el.classList.contains('gap')) { st.a[sid][el.getAttribute('data-gap')] = el.value; }
    else if (el.getAttribute('data-tk')) {
      st.tk[sid] = st.tk[sid] || []; st.tk[sid][+el.getAttribute('data-i')] = el.checked;
      var n = st.tk[sid].filter(Boolean).length, c = document.getElementById('tkc-' + sid);
      if (c) { c.textContent = n + ' of ' + (BYID[sid].b.looksLike || PLAN_CHECKS[sid] || []).length; }
    } else { return; }
    save(); refreshSubmit(sid);
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) { return; }
    var act = b.getAttribute('data-act');
    if (act === 'sec') { gotoSec(b.getAttribute('data-sec')); }
    else if (act === 'part') { var sc = curSec(); st.part[sc.id] = +b.getAttribute('data-i'); save(); render(); toTop(); }
    else if (act === 'next' || act === 'prev') {
      var sec = curSec(), ci = st.part[sec.id] || 0, si = SECTIONS.indexOf(sec);
      if (act === 'next') {
        if (ci < sec.chunks.length - 1) { st.part[sec.id] = ci + 1; save(); render(); toTop(); }
        else if (si < SECTIONS.length - 1) { gotoSec(SECTIONS[si + 1].id, 0); }
      } else {
        if (ci > 0) { st.part[sec.id] = ci - 1; save(); render(); toTop(); }
        else if (si > 0) { var pv = SECTIONS[si - 1]; gotoSec(pv.id, pv.chunks.length - 1); }
        else { gotoSec('start'); }
      }
    }
    else if (act === 'startclock') { startClock(); }
    else if (act === 'pick') { st.img = +b.getAttribute('data-n'); chg = false; save(); render(); }
    else if (act === 'chg') { chg = true; render(); }
    else if (act === 'gochoose') { gotoSec('s3', 0); }
    else if (act === 'zoom') { openLb(+b.getAttribute('data-n')); }
    else if (act === 'submit') {
      var id = b.getAttribute('data-step');
      if (!st.sub[id]) { st.sub[id] = Date.now(); save(); render(); setTimeout(function () { scrollToId('res-' + id); }, 30); }
    }
    else if (act === 'recheck') {
      var rid = b.getAttribute('data-step'), box = document.getElementById('scan-' + rid);
      if (box) { box.innerHTML = rid === 'final' ? finBox() : scanBox(BYID[rid].b); }
    }
    else if (act === 'pdf') {
      if (!(st.name || '').trim()) {
        var nm = $('#nm'), pm0 = $('#pdfMsg');
        if (pm0) { pm0.textContent = 'Enter your name first.'; }
        if (nm) { nm.focus(); }
        return;
      }
      var pm = $('#pdfMsg'), fb = $('#pdfFallback');
      try {
        var doc = makePdf(); doc.save(pdfName());
        if (pm) { pm.textContent = 'Downloaded as ' + pdfName() + '. Now upload it to ' + WHERE + '.'; }
        if (fb) { fb.innerHTML = ''; }
        st.pdfAt = Date.now(); save();
      } catch (err) {
        if (pm) { pm.textContent = 'The PDF could not be created on this device.'; }
        if (fb) {
          fb.innerHTML = '<p class="hint">Copy the text below into a document, save it as a PDF, and upload that file to ' + esc(WHERE) + '.</p><label class="sr" for="report">Report</label><textarea id="report" class="report" readonly>' + esc(buildReport()) + '</textarea>';
          var ta = $('#report'); if (ta) { ta.focus(); ta.select(); }
        }
      }
    }
    else if (act === 'clear') {
      if (b.getAttribute('data-arm') === '1') { st.a = {}; st.sub = {}; st.w = {}; st.tk = {}; st.rev = {}; st.pre = []; st.refl = ''; st.part = {}; st.img = 0; save(); render(); }
      else { b.setAttribute('data-arm', '1'); b.textContent = 'Confirm: clear everything'; setTimeout(function () { b.removeAttribute('data-arm'); b.textContent = 'Clear my work'; }, 4000); }
    }
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="sec"]');
    if (b) { gotoSec(b.getAttribute('data-sec')); }
  });
  $('#btnStart').addEventListener('click', startClock);
  $('#btnReset').addEventListener('click', resetClock);

  /* lightbox */
  var lb = $('#lb');
  function openLb(n) {
    var src = imgSrc(n - 1); if (!src) { return; }
    $('#lbImg').src = src; $('#lbImg').alt = imgAlt(n); $('#lbCap').textContent = imgLabel(n) + '. ' + imgAlt(n);
    lb.hidden = false; $('#lbClose').focus();
  }
  function closeLb() { lb.hidden = true; }
  $('#lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) { closeLb(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) { closeLb(); } });

  buildBars();
  render();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', tick);
  window.__task2 = { st: st, scanFinal: scanFinal, catSummary: catSummary, scanWrite: scanWrite, words: words, strip: strip, BYID: BYID };
})();

</script>
